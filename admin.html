<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoTYF+ Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7f9;
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== LOGIN MODAL ===== */
        .login-modal {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #2a0a2f 0%, #6b215e 100%);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-form {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.18);
            padding: 38px 32px 28px 32px;
            min-width: 340px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-form h2 {
            color: #3a7bd5;
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            font-size: 1.4rem;
        }

        .login-form .subtitle {
            color: #888;
            font-size: 0.85rem;
            font-style: italic;
            margin-bottom: 22px;
        }

        .login-form input {
            margin-bottom: 18px;
            padding: 12px 14px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .login-form input:focus {
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.15);
        }

        .login-form button {
            background: linear-gradient(90deg, #3a7bd5 60%, #00d2ff 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            width: 100%;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        .login-form button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #admin-login-error {
            color: #b91c1c;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }

        /* ===== ADMIN CONTAINER ===== */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 30px;
        }

        h1 {
            color: #3a7bd5;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }

        .logout-btn {
            background-color: #e74c3c;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        h2 {
            color: #007bff;
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 5px solid #007bff;
            padding-left: 12px;
            font-size: 1.15rem;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 1rem;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card .stat-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card .stat-label {
            font-size: 0.78rem;
            opacity: 0.95;
            margin-top: 0.5rem;
            line-height: 1.2;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            background: #fff;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9em;
            min-width: 900px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8fafc;
            color: #3a7bd5;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tr:hover td {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .badge-ya {
            background: #d4edda;
            color: #155724;
        }

        .badge-tidak {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-code {
            background: #e2d9f3;
            color: #6b21a8;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        /* ===== STARS & COMMENT ===== */
        .stars-display {
            color: #fbbf24;
            font-size: 0.95rem;
            letter-spacing: 1px;
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(251, 191, 36, 0.4);
        }

        .stars-empty {
            color: #d1d5db;
        }

        .comment-text {
            font-size: 0.78rem;
            color: #555;
            font-style: italic;
            max-width: 200px;
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
            cursor: help;
        }

        .comment-text:hover {
            color: #3a7bd5;
        }

        /* ===== HORIZONTAL BAR CHART ===== */
        .chart-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .chart-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .chart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: #333;
            font-weight: 500;
        }

        .chart-item-header strong {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #3a7bd5;
        }

        .chart-bar-wrapper {
            width: 100%;
            height: 12px;
            background: #e9ecef;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .chart-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 50px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 5px;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4);
        }

        .chart-empty {
            text-align: center;
            color: #999;
            font-style: italic;
            font-size: 0.9rem;
            padding: 2rem 1rem;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 14px;
            margin-bottom: 2rem;
        }

        /* ===== VERTICAL BAR CHART ===== */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        .bar-chart-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .bar-chart-title {
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #3a7bd5;
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #e9ecef;
        }

        .bar-chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            gap: 2rem;
            height: 300px;
            padding: 0 1rem;
        }

        .bar-column {
            flex: 1;
            max-width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .bar-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .bar-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 0;
        }

        .bar {
            width: 100%;
            min-height: 30px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 0.5rem;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .bar-ya {
            background: linear-gradient(180deg, #4ade80, #16a34a);
        }

        .bar-tidak {
            background: linear-gradient(180deg, #ff6b6b, #dc2626);
        }

        .bar-percent {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .bar-label {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-top: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .loading-text {
            color: #888;
            font-style: italic;
            padding: 1rem 0;
            text-align: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .admin-container { padding: 20px 15px; }
            h1 { font-size: 1.1rem; }
            .admin-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .logout-btn { width: 100%; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }
            .stat-card { padding: 1rem 0.5rem; }
            .stat-card .stat-value { font-size: 1.5rem; }
            .stat-card .stat-label { font-size: 0.7rem; }
            .charts-row { grid-template-columns: 1fr; }
            .bar-chart { height: 220px; }
            table { font-size: 0.8rem; min-width: 800px; }
            th, td { padding: 8px; }
            .stars-display { font-size: 0.8rem; letter-spacing: 0; }
            .comment-text { max-width: 100px; font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card .stat-value { font-size: 1.3rem; }
        }
        
    </style>
</head>
<body>

    <!-- ===== LOGIN MODAL ===== -->
    <div id="admin-login-modal" class="login-modal">
        <form id="admin-login-form" class="login-form">
            <h2>🔐 Admin Panel</h2>
            <p class="subtitle">MoTYF+ Statistics Dashboard</p>
            <input type="password" id="admin-password" placeholder="Kata Laluan Admin" required>
            <p id="admin-login-error">Kata laluan salah.</p>
            <button type="submit">Log Masuk</button>
        </form>
    </div>

    <!-- ===== ADMIN CONTENT ===== -->
    <div id="admin-content" class="admin-container" style="display: none;">
        <div class="admin-header">
            <h1>📊 Panel Pentadbir MoTYF+</h1>
            <button class="logout-btn" onclick="adminLogout()">Log Keluar Admin</button>
        </div>

        <div id="data-overview">
            <p class="loading-text">Memuatkan data dari MongoDB...</p>
        </div>
    </div>

    <script>
        // =========================================
        // KONFIGURASI
        // =========================================
        const API_URL = 'https://motyf-backend.onrender.com/api';
        const ADMIN_PASSWORD = 'motyfadmin2026';

        // =========================================
        // DOM ELEMENTS
        // =========================================
        const adminLoginModal = document.getElementById('admin-login-modal');
        const adminContent = document.getElementById('admin-content');
        const adminLoginForm = document.getElementById('admin-login-form');
        const adminLoginError = document.getElementById('admin-login-error');
        const dataOverview = document.getElementById('data-overview');

        // =========================================
        // LOGIN
        // =========================================
        function checkAdminLogin() {
            if (localStorage.getItem('motyf_admin_logged_in') === 'true') {
                adminLoginModal.style.display = 'none';
                adminContent.style.display = 'block';
                loadAdminData();
            } else {
                adminLoginModal.style.display = 'flex';
                adminContent.style.display = 'none';
            }
        }

        adminLoginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;

            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('motyf_admin_logged_in', 'true');
                adminLoginError.style.display = 'none';
                checkAdminLogin();
            } else {
                adminLoginError.style.display = 'block';
            }
        });

        function adminLogout() {
            if (confirm("Log keluar dari Admin Panel?")) {
                localStorage.removeItem('motyf_admin_logged_in');
                location.reload();
            }
        }

        // =========================================
        // LOAD DATA
        // =========================================
        async function loadAdminData() {
            dataOverview.innerHTML = '<p class="loading-text">Memuatkan data...</p>';

            try {
                const [statsRes, studentsRes] = await Promise.all([
                    fetch(`${API_URL}/admin/stats`),
                    fetch(`${API_URL}/admin/students`)
                ]);

                const stats = await statsRes.json();
                const students = await studentsRes.json();

                let html = '';

                // =========================================
                // STATS CARDS
                // =========================================
                const pct = (n) => stats.total > 0 ? Math.round((n / stats.total) * 100) : 0;

                html += `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-value">${stats.total}</div>
                            <div class="stat-label">Total Pelajar</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value">${stats.careerYa}</div>
                            <div class="stat-label">Dah Ada Hala Tuju (${stats.careerYaPercent}%)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">❓</div>
                            <div class="stat-value">${stats.careerTidak}</div>
                            <div class="stat-label">Belum Ada (${stats.careerTidakPercent}%)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-value">${stats.imkCompleted}</div>
                            <div class="stat-label">Selesai IMK</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">⭐</div>
                            <div class="stat-value">${stats.avgRating || 0}</div>
                            <div class="stat-label">Purata Rating (${stats.feedbackCount || 0} feedback)</div>
                        </div>
                    </div>
                `;

                // =========================================
                // STUDENT TABLE
                // =========================================
                html += '<h2>👥 Senarai Pelajar</h2>';

                if (students.length > 0) {
                    html += `
                        <div class="table-wrapper">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Kelas</th>
                                        <th>Hala Tuju</th>
                                        <th>Kod IMK</th>
                                        <th>Jumpa Kerjaya?</th>
                                        <th>Rating ⭐</th>
                                        <th>Komen</th>
                                        <th>Tarikh Daftar</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    students.forEach(s => {
                        const dirBadge = s.careerDirection === 'YA'
                            ? '<span class="badge badge-ya">YA</span>'
                            : s.careerDirection === 'TIDAK'
                            ? '<span class="badge badge-tidak">TIDAK</span>'
                            : '-';

                        const imkBadge = s.imkCode
                            ? `<span class="badge badge-code">${s.imkCode}</span>`
                            : '-';

                        const exploreBadge = s.foundCareerFromExplore === 'YA'
                            ? '<span class="badge badge-ya">YA</span>'
                            : s.foundCareerFromExplore === 'TIDAK'
                            ? '<span class="badge badge-tidak">TIDAK</span>'
                            : '-';

                        const ratingBadge = s.feedbackRating
                            ? `<span class="stars-display">${'★'.repeat(s.feedbackRating)}<span class="stars-empty">${'☆'.repeat(5 - s.feedbackRating)}</span></span>`
                            : '-';

                        const commentDisplay = s.feedbackComment
                            ? `<span class="comment-text" title="${s.feedbackComment.replace(/"/g, '&quot;')}">${s.feedbackComment.length > 40 ? s.feedbackComment.substring(0, 40) + '...' : s.feedbackComment}</span>`
                            : '-';

                        const date = s.createdAt
                            ? new Date(s.createdAt).toLocaleDateString('ms-MY')
                            : '-';

                        html += `
                            <tr>
                                <td><strong>${s.username}</strong></td>
                                <td>${s.kelas || '-'}</td>
                                <td>${dirBadge}</td>
                                <td>${imkBadge}</td>
                                <td>${exploreBadge}</td>
                                <td>${ratingBadge}</td>
                                <td>${commentDisplay}</td>
                                <td>${date}</td>
                            </tr>
                        `;
                    });

                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    html += '<p class="loading-text">Tiada pelajar lagi.</p>';
                }

                // =========================================
                // BAR CHARTS (2 Carta Menegak)
                // =========================================
                html += `
                    <h2>📊 Carta Perbandingan</h2>
                    <div class="charts-row">
                        ${renderBarChart(
                            'Hala Tuju Kerjaya (Awal)',
                            stats.careerYa,
                            stats.careerTidak,
                            stats.careerYaPercent,
                            stats.careerTidakPercent
                        )}
                        ${renderBarChart(
                            'Soalan Akhir (Selepas Explore)',
                            stats.exploreYa,
                            stats.exploreTidak,
                            stats.exploreYaPercent,
                            stats.exploreTidakPercent
                        )}
                    </div>
                `;

                // =========================================
                // CHARTS LAMA (Horizontal Bar)
                // =========================================
                html += '<h2>🎯 Kod Holland (Huruf Pertama)</h2>';
                html += renderChart(stats.hollandCount);

                html += '<h2>❓ Sebab Belum Ada Hala Tuju</h2>';
                html += renderChart(stats.reasonCount);

                dataOverview.innerHTML = html;

            } catch (error) {
                dataOverview.innerHTML = `
                    <p style="color: red; font-weight: bold;">❌ Ralat: ${error.message}</p>
                    <p>Pastikan backend berjalan di <code>${API_URL}</code></p>
                `;
            }
        }

        // =========================================
        // RENDER HORIZONTAL BAR CHART
        // =========================================
        function renderChart(dataObj) {
            const entries = Object.entries(dataObj || {});

            if (entries.length === 0) {
                return '<p class="loading-text">Tiada data lagi</p>';
            }

            entries.sort((a, b) => b[1] - a[1]);
            const maxVal = entries[0][1];

            let html = '<div class="chart-list">';

            entries.forEach(([label, count]) => {
                const percent = (maxVal > 0 ? (count / maxVal) * 100 : 0);

                html += `
                    <div class="chart-item">
                        <div class="chart-item-header">
                            <span>${label}</span>
                            <span><strong>${count}</strong></span>
                        </div>
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        // =========================================
        // RENDER VERTICAL BAR CHART
        // =========================================
        function renderBarChart(title, yaCount, tidakCount, yaPercent, tidakPercent) {
            const max = Math.max(yaCount, tidakCount, 1);
            const yaHeight = (yaCount / max) * 100;
            const tidakHeight = (tidakCount / max) * 100;

            return `
                <div class="bar-chart-card">
                    <h3 class="bar-chart-title">${title}</h3>
                    <div class="bar-chart">
                        <div class="bar-column">
                            <div class="bar-value">${yaCount}</div>
                            <div class="bar-wrapper">
                                <div class="bar bar-ya" style="height: ${yaHeight}%;">
                                    <span class="bar-percent">${yaPercent}%</span>
                                </div>
                            </div>
                            <div class="bar-label">YA</div>
                        </div>
                        <div class="bar-column">
                            <div class="bar-value">${tidakCount}</div>
                            <div class="bar-wrapper">
                                <div class="bar bar-tidak" style="height: ${tidakHeight}%;">
                                    <span class="bar-percent">${tidakPercent}%</span>
                                </div>
                            </div>
                            <div class="bar-label">TIDAK</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // =========================================
        // INIT
        // =========================================
        document.addEventListener('DOMContentLoaded', checkAdminLogin);
    </script>

</body>
</html>
